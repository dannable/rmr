[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmr"
version = "0.1.0"
description = "Rolemaster Fantasy Roleplaying — chart database, CLI, and Discord bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "David Annable" }]
dependencies = [
    "discord.py>=2.4",
]

[project.optional-dependencies]
# Used only by extract_skeletons.py for one-off PDF transcription work.
dev = ["pdfplumber>=0.11"]

[project.scripts]
rmr-load = "load:main"
rmr-bot  = "bot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "bot*"]
exclude = ["data*", ".scratch*", "tests*"]
