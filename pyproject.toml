[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmr"
version = "0.1.0"
description = "Rolemaster Fantasy Roleplaying — chart database, CLI, and Discord bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "David Annable" }]
dependencies = [
    "discord.py>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Used by extract_skeletons.py for PDF transcription, and by
# scripts/upload_dice_emoji.py for the one-shot emoji bootstrap.
dev = ["pdfplumber>=0.11", "requests>=2.31"]

# FastAPI web app: Discord OAuth + character-builder REST + SSE.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

test = ["pytest>=8"]

[project.scripts]
rmr-bot  = "bot.__main__:main"
rmr-web  = "web.__main__:main"

[tool.setuptools]
# Keep effects.py importable after `pip install .` (bot/ uses it).
py-modules = ["effects"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "bot*", "web*"]
exclude = ["data*", ".scratch*", "tests*", "client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
